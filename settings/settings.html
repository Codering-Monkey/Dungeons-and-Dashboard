<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dungeons & Dashboard</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="settings.css">
</head>
<body id="body">
    <div id="navbar"></div>
    <div class="not-nav">
        <div class="colourBox">
            <h3>Primary</h3>
            <div class="colourScroll" id="primary"></div>
        </div>
        <div class="colourBox">
            <h3>Secondary</h3>
            <div class="colourScroll" id="secondary"></div>
        </div>
        <div class="dropdownBox">
            <h3>Website Style</h3>
            <select id="colourMode">
                <option value="dark">Dark Mode</option>
                <option value="light">Light Mode</option>
            </select>
        </div>
    </div>
    <script type="module" src="../navbar.js"></script>
    <script type="module" src="settings.js"></script>
</body>
</html>
